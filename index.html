<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HashNexus | Join the Waitlist</title>

 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>

    <link rel="stylesheet" href="./dist/output.css">
</head>


<body class="min-h-screen bg-black">
    <main
        class="relative flex min-h-screen items-center justify-center overflow-hidden bg-black px-4 py-8"
    >
        <div
            class="absolute inset-0 bg-cover bg-center bg-no-repeat"
            style="background-image: url('./assets/photo_2026-08-13_23-23-55.jpg');"
        ></div>
        <div
            class="absolute inset-0 bg-black/35"
        ></div>

        <div
            class="relative z-10 flex w-full items-center justify-center"
        >
           <section
    class="w-full max-w-lg
           rounded-2xl
           border border-lime-300/40
           bg-gradient-to-br
           from-black/80
           via-black/70
           to-lime-950/30
           p-7
           shadow-[0_0_40px_rgba(163,230,53,0.12)]
           backdrop-blur-xl
           sm:p-8"
>

                <div class="mb-6 flex justify-center">

                    <div
                        class="flex flex-col items-center gap-2"
                    >
                        <div
                            class="flex h-12 w-12
                                   items-center justify-center
                                   rounded-2xl
                                   border border-lime-300/60
                                   bg-lime-400/10
                                   text-2xl font-black
                                   text-lime-300
                                   shadow-[0_0_25px_rgba(163,230,53,0.25)]"
                        >
                            H
                        </div>
                        <span
                            class="text-lg font-bold
                                   tracking-wide
                                   text-lime-300"
                        >
                            HashNexus
                        </span>

                    </div>

                </div>
                <div class="text-center">

                    <h1
    class="whitespace-nowrap
           text-center
           text-3xl
           font-bold
           tracking-tight
           text-lime-300
           sm:text-4xl"
>
    Join the waitlist
</h1>


                    <p
                        class="mx-auto mt-5 max-w-md
                               text-base
                               leading-relaxed
                               text-lime-100/75
                               sm:text-md"
                    >
                        Be the first to know when we launch.
                        Join the waitlist and get early access.
                    </p>

                </div>
                <form
                    id="waitListForm"
                    class="mt-7"
                >
                    <div class="relative">
                        <div
                            class="pointer-events-none
                                   absolute inset-y-0 left-4
                                   flex items-center"
                        >

                            <svg
                                class="h-5 w-5 text-lime-300"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                viewBox="0 0 24 24"
                            >
                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                />

                                <path
                                    d="m3 7 9 6 9-6"
                                />
                            </svg>

                        </div>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="Enter your email address"
                            required
                            class="w-full
                                   rounded-2xl
                                   border border-lime-300/50
                                   bg-black/50
                                   py-4
                                   pl-12
                                   pr-4
                                   text-lime-100
                                   outline-none
                                   transition
                                   duration-300
                                   placeholder:text-lime-100/35
                                   focus:border-lime-300
                                   focus:bg-black/70
                                   focus:ring-2
                                   focus:ring-lime-300/20"
                        />

                    </div>
                    <button
                        type="submit"
                        class="group mt-4
                               flex w-full
                               items-center
                               justify-center
                               gap-3
                               rounded-2xl
                               border border-lime-200/70
                               bg-gradient-to-b
                               from-yellow-300
                               via-lime-300
                               to-lime-400
                               px-5 py-4
                               text-base
                               font-bold
                               text-black
                               shadow-[0_0_30px_rgba(163,230,53,0.25)]
                               transition
                               duration-300
                               hover:-translate-y-0.5
                               hover:shadow-[0_0_40px_rgba(163,230,53,0.4)]
                               active:translate-y-0"
                    >

                        <span>
                            Join the Waitlist
                        </span>
                        <svg
                            class="h-5 w-5
                                   transition-transform
                                   duration-300
                                   group-hover:translate-x-1"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            viewBox="0 0 24 24"
                        >

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M5 12h14"
                            />

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m13 6 6 6-6 6"
                            />

                        </svg>

                    </button>

                </form>
<div
    class="mt-6 flex
           flex-col
           items-center
           justify-center
           gap-4
           sm:flex-row"
>
    <div class="flex -space-x-3">

        <img
            src="https://i.pravatar.cc/150?img=12"
            alt="Waitlist member"
            class="h-11 w-11
                   rounded-full
                   border border-lime-300/70
                   object-cover
                   shadow-[0_0_15px_rgba(163,230,53,0.2)]"
        >
        <img
            src="https://i.pravatar.cc/150?img=32"
            alt="Waitlist member"
            class="h-11 w-11
                   rounded-full
                   border border-lime-300/70
                   object-cover
                   shadow-[0_0_15px_rgba(163,230,53,0.2)]"
        >
        <img
            src="https://i.pravatar.cc/150?img=47"
            alt="Waitlist member"
            class="h-11 w-11
                   rounded-full
                   border border-lime-300/70
                   object-cover
                   shadow-[0_0_15px_rgba(163,230,53,0.2)]"
        >

    </div>

    <p
        class="text-sm font-medium
               text-lime-200/80"
    >
        Join others on the waitlist
    </p>

</div>

            </section>

        </div>

    </main>



    <!-- JAVASCRIPT -->
    <script src="./js/script.js"></script>

</body>

</html>
