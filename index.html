<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HashNexus | Join the Waitlist</title>

    <!-- Tailwind CSS -->
    <link href="./dist/output.css" rel="stylesheet">
</head>

<body class="min-h-screen">

    <main class="relative min-h-screen overflow-hidden">

        <!-- Blurred Background Image -->
        <div
            class="absolute inset-0 scale-105 bg-cover bg-center bg-no-repeat blur-sm"
            style="background-image: url('./assets/waitlist 4.jpg');"
        ></div>

        <!-- Background Overlay -->
        <div class="absolute inset-0 bg-black/80"></div>

        <!-- Page Content -->
        <div class="relative z-10 flex min-h-screen items-center justify-center px-4">

            <!-- Glass / Glossy Card -->
            <div
    class="w-full max-w-md rounded-3xl
           border border-white/70
           bg-gradient-to-br from-black/90 via-black/75 to-slate-900/70
           p-8
           shadow-2xl shadow-black/40
           backdrop-blur-xl"
>
                <div class="mb-8 text-center">

                    <div class="mb-5 flex justify-center ">

                         <div class="flex h-10 w-30  items-center justify-center
       rounded-full border-2 border-white/30
       bg-white/10 backdrop-blur-md">
                            <span class="text-xl font-bold text-white text-slate-800">
                                HashNexus
                            </span>
                        </div>

                    </div>

                    <!-- Heading -->
                    <h1
                        class="text-4xl font-bold tracking-tight text-white sm:text-5xl"
                    >
                        Join the waitlist
                    </h1>
                    <p
                        class="mt-4 text-base leading-relaxed text-slate-500"
                    >
                        Be the first to know when we launch.
                        Join the waitlist and get early access.
                    </p>

                </div>


                <!-- Waitlist Form -->
                <form
                    id="waitlistForm"
                    class="mt-8 space-y-4"
                >

                    <!-- Email Input -->
                    <div>

                        <label
                            for="email"
                            class="sr-only"
                        >
                            Email address
                        </label>

                        <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email address"
    autocomplete="email"
    class="w-full rounded-xl
           border border-white/25
           bg-white/10
           px-4 py-3.5
           text-white
           shadow-inner
           outline-none
           backdrop-blur-md
           transition
           placeholder:text-white/50
           focus:border-white/50
           focus:bg-white/15
           focus:ring-2
           focus:ring-white/20"
/>

                    </div>


                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="w-full rounded-xl
                               bg-gradient-to-r from-slate-900
                               via-slate-800
                               to-slate-700
                               px-4 py-3.5
                               font-semibold text-white
                               shadow-lg shadow-slate-900/20
                               transition duration-200
                               hover:-translate-y-0.5
                               hover:shadow-xl
                               hover:shadow-slate-900/30
                               active:translate-y-0"
                    >
                        Join the Waitlist
                    </button>

                </form>

                <div
                    class="mt-8 flex items-center justify-center gap-3"
                >

                    <!-- Profile Images -->
                    <div class="flex -space-x-3">

                        <!-- Avatar 1 -->
                        <div
                            class="flex h-10 w-10 items-center justify-center
                                   rounded-full border-2 border-white/80
                                   bg-white/60 backdrop-blur-md"
                        >
                            <svg
                                class="h-5 w-5 text-slate-400"
                                fill="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    d="M12 12a5 5 0 1 0 0-10
                                    5 5 0 0 0 0 10Zm0 2
                                    c-5 0-9 2.5-9 6v2h18v-2
                                    c0-3.5-4-6-9-6Z"
                                />
                            </svg>
                        </div>


                        <!-- Avatar 2 -->
                        <div
                            class="flex h-10 w-10 items-center justify-center
                                   rounded-full border-2 border-white/80
                                   bg-white/60 backdrop-blur-md"
                        >
                            <svg
                                class="h-5 w-5 text-slate-400"
                                fill="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    d="M12 12a5 5 0 1 0 0-10
                                    5 5 0 0 0 0 10Zm0 2
                                    c-5 0-9 2.5-9 6v2h18v-2
                                    c0-3.5-4-6-9-6Z"
                                />
                            </svg>
                        </div>


                        <!-- Avatar 3 -->
                        <div
                            class="flex h-10 w-10 items-center justify-center
                                   rounded-full border-2 border-white/80
                                   bg-white/60 backdrop-blur-md"
                        >
                            <svg
                                class="h-5 w-5 text-slate-400"
                                fill="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    d="M12 12a5 5 0 1 0 0-10
                                    5 5 0 0 0 0 10Zm0 2
                                    c-5 0-9 2.5-9 6v2h18v-2
                                    c0-3.5-4-6-9-6Z"
                                />
                            </svg>
                        </div>

                    </div>


                    <!-- Social Proof Text -->
                    <p class="text-sm font-medium text-white/75">
                        Join others on the waitlist
                    </p>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
